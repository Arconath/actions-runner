name: Arconath runner security

on:
  pull_request:
    branches: [upstream/v2.337.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-runner-security
  cancel-in-progress: false

jobs:
  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: arconath-jit
      labels: [self-hosted, linux, x64, arconath-jit, rootless-buildkit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify patch base and inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          upstream=397b032cbf865e9c3ddfab89d533ec19325e1273
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git rev-parse "$upstream^{commit}")" = "$upstream"
          test -f ARCONATH_PATCHES.md
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' -print | wc -l)" -eq 1
          ! rg -n 'ubuntu-|macos-|windows-' .github/workflows

      - name: Build Linux x64 layout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd src
          ./dev.sh layout Release

      - name: Run credential security tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd src
          ../_dotnetsdk/8.0.424/dotnet test Test/Test.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~GetsJitConfigFileArg|FullyQualifiedName~DeleteLocalRunnerCredentialsPrimesRsaAndRemovesFiles|FullyQualifiedName~CachedKeyRemainsUsableAfterCredentialFileDeletion|FullyQualifiedName~ReloadsCachedMigratedOAuthCredentialsAfterFilesAreUnlinked|FullyQualifiedName~SealedEphemeralRunnerRejectsConfigurationRefresh'
